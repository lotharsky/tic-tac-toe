<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="TitleDiv">
        <h1>TIC TAC TOE</h1>
    </div>

    <div class="ScoreDiv">
        <div class="ScoreBoard">
            <p class="ScorePOne">0</p>
            <p>:</p>
            <p class="ScorePTwo">1</p>
        </div>
    </div>

    <div class="BoardDiv">
        <div class="Board"></div>
    </div>

</body>
</html>
